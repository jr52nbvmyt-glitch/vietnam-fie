by = "000"
rung = "a"
reason = "Historical baseline before any provision"

[[history]]
by = "011"
rung = "b"
reason = "No Watergate: Nixon in office, FY1975 aid about $950M, Thieu refuses the withdrawal of 14 March; I and II Corps collapse three to five weeks late, the assault on Saigon falls into the rains and is put back to 1976 (EVMT01-4). Saigon stands past 30 April 1975 (b2)."
