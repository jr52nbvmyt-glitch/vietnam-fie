# The end state of the war as it now stands. One copy, here.
# A memo or review that changes it sets last_changed and appends a [[history]] entry.
# rung: a | b | c | d | e (A9), or "off" with off_ladder naming the outcome (G5).

rung = "b"
rung_label = "Dependent survival"
off_ladder = ""
summary = "A reprieve of about a year. The Republic of Vietnam loses the Highlands, northern I Corps and the central coast in the spring offensive of 1975 but is not attacked at Saigon: the collapse of I and II Corps comes three to five weeks later than history's, and Hanoi puts the offensive on the capital back to the dry season of 1975–76. On 31 December 1975 the Republic holds III and IV Corps and the coast from Nha Trang south under Thieu, with no American air power; its fall is expected between February and May 1976."
saigon_falls = "open"             # yes | no | open
saigon_falls_date = ""
us_combat_forces = "Withdrawn by March 1973 under the Paris Peace Accords; American combat in Indochina ended by law on 15 August 1973"
hanoi_posture = "Committed to armed reunification throughout; in March 1975 it put the offensive on Saigon back to the dry season of 1975–76"
last_changed = "011"

