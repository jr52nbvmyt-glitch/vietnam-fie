memo = "017"
title = "US Army Intelligence Support Activity (ISA) at undivided commitment, attached to MACV-JSOC from September 1964, with eight cleared heritage Vietnamese interpreters"
received = "2026-11-26"
status = "part1"
version = "1.0.6"
phases_changed = []
links = ["002", "003", "006", "012", "014"]

[deviation]
part1 = "none"
part2 = "none"
part3 = "none"

[[provision]]
id = "P017a"
designation = "US Army Intelligence Support Activity (USAISA, 'the Activity', Task Force Orange), in its 2026 configuration and at full strength: the whole unit committed to Vietnam, with its operations (clandestine human intelligence and close-target reconnaissance) squadron, its signals intelligence squadron, its mission support and communications squadron, its analysis, medical and logistics detachments and its small fleet of manned special-mission aircraft, attached to the MACV Joint Special Operations Command of memorandum 014 (P014b) to find targets for SFOD-D (P014a) and, second, for the combined task force against the infrastructure of memorandum 012 (P012b), MACV J-2 on request; without the wider JSOC package (no 160th SOAR, no dedicated JSOC drone wing, no national systems beyond the space_constellations condition); with eight TS/SCI-cleared heritage Vietnamese-speaking interpreters attached from arrival; across the borders only where and when history's forces went"
category = "isr"
quantity = "the whole unit, undivided commitment [U]; ~360–440 personnel [E: open-source growth from about 100 in 1981 to a three-squadron unit with an aviation element and support detachments, D1], plus 8 TS/SCI-cleared heritage Vietnamese interpreters [U]"
ceiling_spaces = "~370–450 [E: the whole unit and its eight interpreters; no ceiling (CONFIG troop_ceiling = NONE)]"
arrival = "1964-09-01"
in_service = "Field Operations Group formed summer 1980; USAISA activated 3 March 1981 [S1]; under JSOC from 2003 [S1]; the 2026 unit is the reference configuration [U]"
systems = ["FIND", "SUBVERT", "STRIKE", "INTERDICT"]
status = "active"

