[[provision]]
id = "P005a"
designation = "Boeing B-52J Stratofortress, programme-of-record configuration: B-52H airframe re-engined with eight Rolls-Royce F130 turbofans (Commercial Engine Replacement Program), Raytheon AN/APQ-188 AESA radar (Radar Modernization Program), digital cockpit displays, 1760 Internal Weapons Bay Upgrade, GPS-aided navigation and the H's electronic-warfare suite, replacing every B-52 one for one"
category = "air"
quantity = "Every B-52 in the USAF inventory replaced one for one [U]: about 600 airframes in 1964 across SAC [E: 744 B-52s built, less attrition and retirements of early B and C models], of which the force committed to Southeast Asia follows the historical deployment: 30 in mid-1965 [H], about 50–70 through 1966–67 [E: sortie rates of about 800 a month by mid-1967 per S9], about 90–100 from early 1968 [E: 1,800 sorties a month from February 1968 per S9], 210 at the 1972 peak [S9]"
ceiling_spaces = "0 in RVN for the bomber force itself [E: Arc Light flew from Guam, U-Tapao and Okinawa]; about 40 in RVN for an enlarged Arc Light liaison and target-coordinate cell at MACV and Seventh Air Force [E: the historical ARC LIGHT liaison element plus a coordinate-mensuration team]; outside RVN, maintenance manpower about 10–20% below the historical B-52 force [E: F130 needs no off-wing overhaul per S4, five-man crew per S2 against the D's six]"
arrival = "1964-01-01"
in_service = "Not yet in service: CERP Milestone B June 2026, initial operational capability mid-FY2033 [S1] [S3]; the B-52H airframe entered service in 1961 [E: Boeing delivery history]"
systems = ["STRIKE", "INTERDICT", "FIX", "SUSTAIN"]
status = "active"

[[provision]]
id = "P005b"
designation = "GBU-31 Joint Direct Attack Munition, 2,000 lb class: GBU-31(V)1/B on the Mk 84 general-purpose bomb and GBU-31(V)3/B on the BLU-109 penetrator, Boeing GPS-aided INS tail kit, with FMU-152 or equivalent programmable fuze, 2026 configuration"
category = "air"
quantity = "Supplied with the B-52J force at realistic production rates [U]: about 8,000–12,000 kits a year from 1964 for the bomber force [E: about a third of a JDAM production line of 25,000–40,000 kits a year, the rest going to the GBU-38 and to stocks]"
ceiling_spaces = "~60 in RVN [E: a coordinate-mensuration and weaponeering cell at MACV J-2 and Seventh Air Force working in shifts]; kit build-up and loading crews of about 150–250 at Andersen and U-Tapao outside RVN [E: munitions maintenance squadron increments]"
arrival = "1964-01-01"
in_service = "1999 (Operation Allied Force) [S7]"
systems = ["STRIKE", "INTERDICT"]
status = "active"

[[provision]]
id = "P005c"
designation = "GBU-38 Joint Direct Attack Munition, 500 lb class: Boeing GPS-aided INS tail kit on the Mk 82 or BLU-111 bomb body, with FMU-152 or equivalent programmable fuze, 2026 configuration"
category = "air"
quantity = "Supplied with the B-52J force at realistic production rates [U]: about 15,000–25,000 kits a year from 1964 [E: the larger share of a JDAM production line of 25,000–40,000 kits a year]"
ceiling_spaces = "~0 additional in RVN [E: shares the P005b coordinate cell]; about 100 loaders and kit builders outside RVN [E: the 500 lb kit's higher count per sortie]"
arrival = "1964-01-01"
in_service = "Second quarter FY2005 for the Navy [S8]; Air Force fielding from about 2004 [E: reporting of the period]"
systems = ["STRIKE", "FIX"]
status = "active"

[[provision]]
id = "P005d"
designation = "Quickstrike family of aircraft-laid bottom influence mines: Mk 62 (500 lb), Mk 63 (1,000 lb) and Mk 64 (2,000 lb) on Mk 80-series bomb bodies, Mk 65 (2,000 lb class thin-walled case), and Mk 64 Mod 5 Quickstrike-ER with the JDAM-ER wing kit, with Mk 57 and Mk 71 target detecting devices (magnetic, seismic, pressure and acoustic), 2026 configuration"
category = "naval"
quantity = "Supplied with the B-52J force at realistic production rates [U]: about 3,000–6,000 mines a year from 1964, of which a few hundred Quickstrike-ER [E: conversion kits on existing bomb bodies, with target detecting devices the rate limit; QS-ER still in demonstration per S15]"
ceiling_spaces = "~0 in RVN [E: assembly and preset at Guam and U-Tapao]; about 40–60 Navy mine assembly and preset specialists outside RVN [E: a Mobile Mine Assembly Group detachment]"
arrival = "1964-01-01"
in_service = "1983 for Mk 62, Mk 63 and Mk 65 [S11]; Quickstrike-ER in operational demonstration from 2016, not yet at initial operational capability [S14] [S15]"
systems = ["INTERDICT", "STRIKE"]
status = "active"

