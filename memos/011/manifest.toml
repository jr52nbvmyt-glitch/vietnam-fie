# The user's rulings, 24 Nov 2026, in the memorandum 011 thread [U]:
#   1) "American Political Tolerance Package" is the name for the three items: three provisions.
#   2) Watergate: the break-in never happens.
#   3) Volunteers: reading A — the same men serve, a quarter of the historically inducted enlisted voluntarily instead; draft calls a quarter smaller; force size unchanged.
#   4) My Lai: isolated and stipulated — only the Son My massacre of 16 Mar 1968 is removed, with no cause inside the war; other atrocities stay historical.

[[provision]]
id = "P011a"
designation = "No Watergate: the Committee for the Re-election of the President's break-ins at the Democratic National Committee offices in the Watergate building, 28 May and 17 June 1972, never happen, and with them the arrests, the cover-up, the Senate Watergate Committee, the special prosecutor, the impeachment proceedings and the resignation; Richard Nixon serves his second term to 20 January 1977"
category = "other"
quantity = "Both break-ins removed [U]; everything that followed from them removed with them; the abuses before May 1972 (the 1969 wiretaps, the 1971 'plumbers') stay in the war but are never exposed by a Watergate investigation [E: D1 reading]"
ceiling_spaces = "0 [U]"
arrival = "1972-05-28"
in_service = "Counterfactual removal of a historical event; no real-world equivalent"
systems = ["SUSTAIN"]
status = "active"

[[provision]]
id = "P011b"
designation = "Volunteers in place of a quarter of the draft: of the men historically inducted by the Selective Service System from 1964 to the end of inductions in 1973, one in four enlists voluntarily instead; the same men serve, in the same services, specialties, terms and tours; Selective Service draft calls are a quarter smaller in every month"
category = "institutional"
quantity = "One quarter of historical inductions [U]: about 464,000 of the 1,857,304 men inducted Aug 1964 – Feb 1973 [D]; draft calls a quarter smaller in each year, from about 84,000 instead of 112,386 in 1964 to about 287,000 instead of 382,010 at the 1966 peak and about 37,000 instead of 49,514 in 1972 [D]"
ceiling_spaces = "0 [U]"
arrival = "1964-01-01"
in_service = "Counterfactual change to the historical draft; no real-world equivalent"
systems = ["SUSTAIN"]
status = "active"

[[provision]]
id = "P011c"
designation = "No My Lai: the killing of the villagers of Son My village (My Lai 4 and My Khe), Son Tinh District, Quang Ngai Province, by Company C, 1st Battalion, 20th Infantry and Company B, 4th Battalion, 3rd Infantry, 11th Infantry Brigade, Americal Division, on 16 March 1968 does not happen; isolated and stipulated, with no cause inside the war; other atrocities stay historical"
category = "other"
quantity = "One event removed [U]: the 347–504 villagers killed historically [H] live; the cover-up, the Ridenhour letters, the Hersh report, the Peers inquiry and the Calley court-martial do not occur [D]"
ceiling_spaces = "0 [U]"
arrival = "1968-03-16"
in_service = "Counterfactual removal of a historical event; no real-world equivalent"
systems = ["SECURE", "SUSTAIN"]
status = "active"

