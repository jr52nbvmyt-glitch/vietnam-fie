[[provision]]
id = "P003a"
designation = "Lockheed Martin U-2S Dragon Lady (Block 20), 2026 configuration: ASARS-2A synthetic aperture radar with moving-target indication, SYERS-2C multispectral electro-optical and infrared camera, ASIP signals intelligence payload, with a deployable ground exploitation station"
category = "isr"
quantity = "2 aircraft [U]"
ceiling_spaces = "~220 [E: four to five pilots and a mobile-crew cell, about 90 maintainers and life-support technicians, about 20 contractor field engineers, and an exploitation and SIGINT cell of about 100 in shifts]"
arrival = "1964-01-01"
in_service = "U-2S from the re-engining programme of 1994 onward on the U-2R/TR-1 airframe (U-2R first flight 1967); 2026 fleet 27 U-2S and 4 TU-2S at Beale AFB"
