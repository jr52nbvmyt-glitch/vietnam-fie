# Manifest for memorandum 010.

memo = "010"
title = "NCO education to the 2026 US standard for every US NCO and every RVNAF regular and territorial NCO from 1957, each course a gate for the next promotion"
received = "2026-11-24"
status = "complete"
version = "1.0.5"
phases_changed = ["P1", "P2", "P3", "P4"]
links = ["006", "007", "009"]

[deviation]
part1 = "none"
part2 = "none"
part3 = "none"

[[provision]]
id = "P010a"
designation = "US enlisted professional military education to the 2026 standard for every NCO of the four services from 1957: the Army's NCO Professional Development System (the 29-day Basic Leader Course, the Advanced and Senior Leader Courses, the Master Leader Course and the 10-month Sergeants Major Course) under Select, Train, Educate, Promote; the Marine Corps' Corporals Course, Sergeants School, Career and Advanced School programmes, SNCO Leadership School and First Sergeants School; the Navy and Air Force enlisted leadership continua; each course a gate for the next promotion"
category = "institutional"
quantity = "Every US NCO from 1957 [U]: the NCOs serving in 1957 put through the course for their grade in 1957–60 and every man promoted since through his course before promotion; about 120,000–180,000 Army and Marine course completions a year in 1957–64 and about 250,000–350,000 at the 1967–69 peak, with about as many again in the Navy and Air Force [E: D1 and D5, from NCO strengths of the period and promotion rates]; by 1 Jan 1964 every serving NCO holds the course for his grade [U: standing condition nco_education_1957]"
ceiling_spaces = "~250–450 US personnel in RVN [E: a MACV NCO academy at about 150–250 cadre teaching the Basic Leader Course in theater to men promoted there, and NCO course cells at the field force and Marine amphibious force headquarters]; about 4,000–7,000 added instructor and staff spaces in the United States at the peak and about 2–3% of the NCO corps in school at any time, outside the ceiling [E: D2]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "2026 configuration: Army STEP from 2016, the 29-day BLC fielded from mid-2026, the 2025 shortening of ALC and SLC to three weeks resident; Marine EPME by grade per MARADMIN 630/24; the 1957–63 cohorts are a standing condition"
systems = ["FIX", "SECURE", "SUSTAIN"]
status = "active"

[[provision]]
id = "P010b"
designation = "RVNAF NCO education on the 2026 US Army NCO Professional Development System for every NCO of the ARVN, Airborne, Rangers, Vietnamese Marines, VNAF and VNN and of the Regional and Popular Forces (Civil Guard and Self-Defense Corps before 1964) from 1957 (RF and PF by erratum E03): a Basic Leader Course for corporals and sergeants, an Advanced Leader Course for squad and section leaders, a Senior Leader Course for platoon sergeants, a Master Leader Course for first sergeants and battalion senior NCOs and a senior NCO course, in Vietnamese at the National NCO Academy at Nha Trang (Dong De), division and service NCO schools and the RF/PF training centres, with MAAG and MACV advisers, each course a gate for the next promotion"
category = "institutional"
quantity = "Every RVNAF regular and RF/PF NCO from 1957 [U]: regular NCOs about 18,000–28,000 in 1957, 35,000–50,000 in 1964 and 90,000–130,000 at the 1970 peak, RF/PF NCOs about 10,000–15,000, 25,000–40,000 and 55,000–80,000 [E: D1 and E03]; about 14,000–24,000 course completions a year in 1957–63, 27,000–45,000 in 1964–67 and 50,000–80,000 at the 1968–70 peak [E: D1 and E03, against S8's 16,522 students at the Nha Trang academy in 1970]; by 1 Jan 1964 every serving regular and territorial NCO holds the course for his grade [U: standing condition nco_education_1957]"
ceiling_spaces = "~210–420 US personnel in RVN, of whom ~180–380 military spaces [E: an advisory detachment of 40–70 at the Nha Trang academy, teams of four to eight at 10–15 division and service NCO schools, teams of two to five at 19–37 RF/PF centres and a curriculum and translation cell at the Central Training Command; E03]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "2026 US Army NCO Professional Development System adapted in Vietnamese; no real-world equivalent; the 1957–63 cohorts are a standing condition"
systems = ["FIX", "SECURE", "ADVISE", "SUSTAIN"]
status = "active"

