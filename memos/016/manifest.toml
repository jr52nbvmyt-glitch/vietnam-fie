# One [[provision]] per system. Letters a, b, c … in order.
[[provision]]
id = "P016a"
designation = "Glock 21 Gen5 MOS .45 Auto pistol in its 2026 configuration (13-round magazine, Glock factory tritium night sights (GNS), accessory rail) with a SureFire X300T Turbo weapon light (650 lumens, 66,000 candela, two 123A lithium cells) mounted on every pistol, carried in a light-bearing duty holster; replacing every M1911A1, M1917, .38 revolver and other handgun of the US forces in Southeast Asia and of the RVNAF (ARVN, VNAF, VNN, VNMC, Regional and Popular Forces), and issued as the standard handgun of the National Police and the National Police Field Force; the police keep their historical long arms (E05)"
category = "ground"
quantity = "about 55,000–60,000 pistols and lights in theater in 1964, rising to about 230,000–250,000 at the 1969–72 peak, plus a 10% float [E: D1; about one pistol per eight US personnel in theater, one per ten RVNAF regulars, one per twenty-five territorials and one per National Policeman, against the strengths in S6, S7 and the record]"
ceiling_spaces = "~40–60 [E: D2; a US armament and training detachment for the RVNAF and police issue in 1964, absorbed into the existing advisory structure after 1966; no ceiling (CONFIG troop_ceiling = NONE)]"
arrival = "1964-01-01"
in_service = "Glock 21 introduced 1990; Gen5 G21 announced February 2023 [S1] [S3]; SureFire X300T Turbo introduced 2021 [E: manufacturer release history]"
systems = ["SECURE", "FIX", "SUBVERT"]
status = "active"

[[push]]
provision = "P016a"
var = "US.casualties"
dlow = -15
dhigh = -10
at = "P2"
conf = "low"
note = "10–15 fewer Americans killed by hostile action in 1967: tunnel and bunker clearers who now carry 13 rounds with a light on the gun and a free hand, and the few men in each close fight whose rifle is empty or jammed at arm's length; low confidence, it could plausibly be half or double"

