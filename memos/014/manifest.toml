links = ["003", "006", "012", "013"]

[deviation]
part1 = "none"
part2 = "none"
part3 = "none"

[[provision]]
id = "P014a"
designation = "1st Special Forces Operational Detachment-Delta (SFOD-D, Delta Force), US Army, in its 2026 configuration and at full strength: the whole unit committed to Vietnam, with its assault squadrons, its reconnaissance and surveillance squadron, its organic aviation squadron and its support squadrons, without the wider JSOC package (no 160th SOAR, no dedicated JSOC ISR wing); missions: hunting PAVN and VC leadership and the infrastructure, COSVN and the base areas, POW recovery, raids into the North and reconnaissance, across the borders only where and when history's forces went"
category = "ground"
quantity = "the whole unit, full commitment [U]; ~1,000–1,500 personnel of whom ~250–350 operators [E: open-source estimates of Delta's strength, D1]"
ceiling_spaces = "~1,000–1,500 [E: the whole unit; no ceiling (CONFIG troop_ceiling = NONE)]"
arrival = "1964-09-01"
in_service = "activated 19 November 1977 [S]; the 2026 unit is the reference configuration [U]"
systems = ["FIND", "FIX", "STRIKE", "SUBVERT"]
status = "active"

[[provision]]
id = "P014b"
designation = "MACV Joint Special Operations Command (MACV-JSOC), newly formed after the Gulf of Tonkin incident: a joint headquarters under COMUSMACV that commands SFOD-D and the special operations units the user will assign to it later, with standing liaison to MACV J-2 and J-3, MACV-SOG, the CIA station, the Combined Interagency Task Force of memorandum 012, the Joint General Staff and the US Mission, for logistics, targeting and deconfliction"
category = "institutional"
quantity = "one headquarters, formed August 1964 [U]; ~250–450 personnel [E: D2]"
ceiling_spaces = "~250–450 [E: a joint task force headquarters at the scale of the early JSOC of 1980–81; no ceiling (CONFIG)]"
arrival = "1964-08-15"
in_service = "JSOC established 15 December 1980 [S]; MACV-SOG, the nearest period precedent, formed 24 January 1964 [S]"
systems = ["FIND", "FIX", "STRIKE", "SUSTAIN"]
status = "active"

