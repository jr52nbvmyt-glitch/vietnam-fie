# Manifest for memorandum 012.
# status and phases_changed are set by fie.py; leave them alone.

memo = "012"
title = "Combined US–RVN–ROK–Australian operations command; combined interagency task force against the VCI"
received = "2026-11-24"
status = "part1"
version = "1.0.6"
phases_changed = []
links = ["002", "006"]

[deviation]
part1 = "none"
part2 = "none"
part3 = "none"

[[provision]]
id = "P012a"
designation = "Combined Operations Command, Vietnam: a combined US, Republic of Vietnam, Republic of Korea and Australian operations command under COMUSMACV as combined commander, with Vietnamese, Korean and Australian deputies and an integrated combined staff on the 2026 model of the ROK–US Combined Forces Command and the coalition joint headquarters, holding operational control of the ARVN corps and their divisions, the ROK forces in Vietnam and the Australian task force, the national chains keeping administration, discipline and the right of appeal to their governments"
category = "institutional"
quantity = "One combined headquarters in Saigon and four combined corps-area operations centres [U: the user's default: COMUSMACV commands, RVNAF, ROK and Australian forces under its operational control]; command and staff only, the allied contingents at their historical size and timing [U]"
ceiling_spaces = "~700–1,000 US personnel, of whom ~600–900 military spaces [E: an integrated combined staff of about 1,400–2,000 at the headquarters and the four corps-area centres, about half American, against the historical MACV staff, which the combined staff absorbs in part]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "No real-world equivalent in Vietnam; the ROK–US Combined Forces Command from 7 November 1978 is the nearest standing model"
systems = ["FIX", "STRIKE", "SECURE", "ADVISE", "SUSTAIN", "FIND"]
status = "active"

[[provision]]
id = "P012b"
designation = "Combined Joint Interagency Task Force against the Viet Cong Infrastructure: a standing combined task force on the 2026 counter-network model of the campaigns against al-Qaeda in Iraq, the Taliban and the Islamic State, fusing the intelligence and the assets of civil, military and intelligence agencies of the United States, the Republic of Vietnam, the Republic of Korea and Australia in an F3EAD targeting cycle, with its own exploitation and analysis centre, dedicated lift and ISR, police-led arrest teams and military raid forces for the dismantling of the VC infrastructure, under the GVN's existing arrest and detention law"
category = "institutional"
quantity = "One combined task force of about 2,500–3,000 people with a national fusion centre in Saigon, four corps-area task groups and a cell in each province [U: the user's default]; police-based and military-based action against the VCI combining civil, military and intelligence agencies [U]"
ceiling_spaces = "~900–1,200 US personnel, of whom ~650–900 military spaces [E: about 35–40% of the task force American: analysts, exploitation and SIGINT teams, SOF raid elements, aviation and ISR detachments, liaison to the Agency]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "No real-world equivalent in Vietnam; the 2026 model is the counter-network task force of 2004–2019 (Task Force 714 and its successors in Iraq, Afghanistan and Syria)"
systems = ["FIND", "FIX", "STRIKE", "SUBVERT", "SECURE"]
status = "active"

