# Manifest for memorandum 007.

memo = "007"
title = "Officer education to the 2026 standard for new US and ARVN officers from 1957, gating promotion; ARVN officer selection and promotion reform"
received = "2026-11-24"
status = "part2"
version = "1.0.5"
phases_changed = []
links = ["001", "002", "006"]

[deviation]
part1 = "none"
part2 = "none"
part3 = "none"

[[provision]]
id = "P007a"
designation = "US officer education to the 2026 standard for new officers of the Army and Marine Corps (and the Air Force and Navy continua), commissioned from 1957: the Army's Basic Officer Leader Course (BOLC A and B), Captains Career Course with its distributed-learning phase, and Command and General Staff Officer Course (Intermediate Level Education); the Marine Corps' Basic School, Expeditionary Warfare School and Command and Staff College; each course a gate for the next promotion"
category = "institutional"
quantity = "Every new US officer commissioned from 1957 [U]: about 15,000–20,000 Army and Marine officers a year in 1957–64, rising to about 40,000–50,000 a year at the 1967–69 peak [E: active Army and Marine officer accessions of the period, with the wartime OCS expansion]; the 1957–63 classes completed it before the campaign opened [U: standing condition officer_cohorts_1957]"
ceiling_spaces = "~0 in RVN [E: every course is taught in the United States]; about 1,500–2,500 instructor and staff spaces added to the training base in the United States by 1967, outside the ceiling [E: student load at 2026 small-group ratios]; in effect about 4–6% of the company- and field-grade officer strength in school at any time instead of in units [E: course lengths against career length]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "2026 configuration of a continuum built 2006–2022 (BOLC from 2006–10, CCC modernization 2022); the 1957–63 classes are a standing condition"
systems = ["ADVISE", "FIX", "SECURE", "SUSTAIN"]
status = "active"

[[provision]]
id = "P007b"
designation = "RVNAF officer education to the 2026 standard for new ARVN officers commissioned from 1957: a branch basic course after commissioning at Thu Duc or Dalat, a Captains Career Course and a resident Command and General Staff course at Dalat built on the US 2026 curricula in Vietnamese, with MAAG and MACV faculty advisers, each course a gate for the next promotion"
category = "institutional"
quantity = "Every new ARVN officer commissioned from 1957 [U]: about 2,000–3,000 a year in 1957–63, about 4,000–6,000 a year in 1964–67 and about 8,000–12,000 a year at the 1968–71 peak [E: Thu Duc's 40,900 graduates 1952–Nov 1969 per S2, Dalat's fewer than 200 a year per S3, and the mobilization of 1968]; seven classes of about 13,000–18,000 officers completed the basic course before 1964 [E: same basis; U: standing condition officer_cohorts_1957]"
ceiling_spaces = "~350–500 US personnel in RVN, of whom ~300–450 military spaces [E: faculty advisers and translators at three schools and a curriculum cell at the JGS Central Training Command, against the historical school advisory detachments]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "2026 US curricula adapted; the 1957–63 classes are a standing condition"
systems = ["ADVISE", "FIX", "SECURE", "SUSTAIN"]
status = "active"

[[provision]]
id = "P007c"
designation = "RVNAF Officer Selection and Promotion Reform, 1964: an independent Officer Selection and Promotion Board under the Joint General Staff with written criteria, a two-tier rater and senior-rater evaluation report on the 2026 US model with a capped top block, centrally selected battalion and regimental command lists, relief for cause, an open path to commission for proven NCOs, removal of the diploma bar to promotion, and general-officer promotion and division command filled from a ranked board list, protected by an American aid condition"
category = "institutional"
quantity = "One national board system [U]: about 12,000–16,000 officer promotions and about 150–250 battalion and regimental command selections a year in 1964–67 [E: an officer corps of about 18,000–24,000 regular officers in 1964 growing toward 50,000–60,000 by 1972, with the 1969 increment of 2,653 senior officers per S1]"
ceiling_spaces = "~60–90 US personnel, of whom ~40–60 military spaces [E: an advisory cell to the board and the JGS personnel directorate, evaluation-system trainers, and a share of the senior advisers' time]; no troop ceiling is set (CONFIG)"
arrival = "1964-01-01"
in_service = "Design on the 2026 US Army officer evaluation and centralized selection systems; no real-world RVNAF equivalent"
systems = ["ADVISE", "SECURE"]
status = "active"

