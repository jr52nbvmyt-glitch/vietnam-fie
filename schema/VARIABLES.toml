# World variables — the controlled vocabulary through which provisions interact.
#
# Provisions rarely act on each other directly; they act on the same parts of the
# war. Each provision's manifest declares which variables it PUSHES (with a change)
# and which it DEPENDS ON. scripts/fie.py routes earlier provisions to a new memo
# by shared variables, and builds a ledger per variable.
#
# NATURAL UNITS (from v1.0.8, revisions/R03). Every variable is measured in a unit of
# the war itself, never on an abstract scale. Every value is still a judgment, never a
# measurement (A12, A13): a range in the unit, with a confidence and a note.
#   kind = "count"  — a quantity (tons a year, thousands of men, dollars, minutes)
#   kind = "share"  — a percentage of the stated whole; changes are in percentage points
#   kind = "months" — a duration in months
#   kind = "ladder" — ordered rungs, listed in `rungs`; values are rung numbers
#   better = "higher" | "lower" — which direction favours the allies
#   unit — what one unit is. A faceted variable gives each facet its own unit.
#
# A VALUE (a chapter's end-vector or snapshot entry) is an inline table:
#   hist  = history's figure at the phase's end date (a number, or a rung)       } together,
#   src   = its provenance: [H…], [S…], [M005·S2] or [R03·S1]                     } or both absent
#   low, high   = this war's figure as a range in the unit — the preferred form; or
#   dlow, dhigh = this war's difference from history in the unit, used while hist is
#                 unresearched (a share's difference is in percentage points); or
#   plow, phigh = this war's difference from history as a percentage of history's figure
#   conf  = "low" | "medium" | "high" — how far the record supports the range;
#           "unjudged" — not yet judged in units (no range)
#   was   = the value on the retired scale, kept for the record (v1.0.6 and earlier)
#   binding = the facet that decides outcomes, on a faceted parent once any facet is judged
#   note  = one line: the mechanism on the ground, not a restatement of the figure
# From v1.0.9 (R07, RULES A12b) the range is presented narrow, around the best estimate:
# about a fifth of its midpoint, a share about 5 points, a difference about a third of its
# larger end. The real uncertainty is carried by conf, never by widening the range; where
# it is much wider than the range shown, the note says so once.
#
# A PUSH (a provision's manifest, memoranda 014 on) is the provision's own contribution,
# other things equal, as a change in the unit at a stated phase:
#   { var, dlow, dhigh, at = "Pk", conf, note }  (or plow/phigh as % of history's figure;
#   for a ladder, dlow/dhigh are rungs, or months earlier (−) or later (+) with `months = true`)
#
# THE RETIRED SCALES. The −3..+3 bands (memoranda 001–010) and the −10..+10 ranges
# (memoranda 011–013, and every chapter value before R03) are history and stay as
# written in those memoranda; the script shows them marked with their scale. A chapter
# value on the −10..+10 scale is kept only in `was`.
#
# FACETS. A variable whose parts fail separately has facets: sub-variables with IDs
# "<variable>.<facet>", each with its own unit. A provision that acts on one facet pushes
# that facet, not the parent. In a phase end vector, a faceted vector variable carries
# its parent and every facet; the parent remains a judgment, not an average, and once
# any facet is judged it names its binding facet. Routing treats a facet as its parent.
#
# vector = true marks the headline variables every phase chapter carries in its
# end vector (and in the snapshot of a phase that has one). The ripple rule compares these.
#
# Adding a variable or a facet, or changing a unit, is a version change: bump VERSION
# and every version header.

version = "1.0.9"

# ----------------------------------------------------------------- population
[[var]]
id = "POP.night_control"
name = "Night control of hamlets"
higher = "more hamlets held by the GVN after dark"
indicators = "VCI tax collection; PF night ambush and patrol rate; hamlet officials sleeping in the hamlet; HES only with its A13 caveat"
systems = ["SECURE"]
vector = true
kind = "share"
unit = "% of the rural population living in hamlets the GVN holds after dark (HES A–C, cited only with the A13 caveat)"
better = "higher"
facets = [
  { id = "I_corps", name = "I Corps: the five northern provinces", unit = "% of I Corps' rural population in hamlets the GVN holds after dark", kind = "share" },
  { id = "II_corps", name = "II Corps: the Central Highlands and the central coast", unit = "% of II Corps' rural population in hamlets the GVN holds after dark", kind = "share" },
  { id = "III_corps", name = "III Corps: the provinces around Saigon", unit = "% of III Corps' rural population in hamlets the GVN holds after dark", kind = "share" },
  { id = "IV_corps", name = "IV Corps: the Mekong Delta", unit = "% of IV Corps' rural population in hamlets the GVN holds after dark", kind = "share" },
]

[[var]]
id = "POP.displacement"
