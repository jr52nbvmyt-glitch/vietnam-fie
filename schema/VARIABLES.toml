  { id = "I_corps", name = "I Corps: the five northern provinces", unit = "% of I Corps' rural population preferring the GVN", kind = "share" },
  { id = "II_corps", name = "II Corps: the Central Highlands and the central coast", unit = "% of II Corps' rural population preferring the GVN", kind = "share" },
  { id = "III_corps", name = "III Corps: the provinces around Saigon", unit = "% of III Corps' rural population preferring the GVN", kind = "share" },
  { id = "IV_corps", name = "IV Corps: the Mekong Delta", unit = "% of IV Corps' rural population preferring the GVN", kind = "share" },
]

