# World variables — the controlled vocabulary through which provisions interact.
#
# Provisions rarely act on each other directly; they act on the same parts of the
# war. Each provision's manifest declares which variables it PUSHES (with a band)
# and which it DEPENDS ON. scripts/fie.py routes earlier provisions to a new memo
# by shared variables, and builds a ledger per variable.
#
# Bands are judgments, never measurements (A12, A13):
#   0 no effect · ±1 noticeable · ±2 substantial · ±3 transformative
# For a provision's push: its own contribution, other things equal.
# For a phase end vector: the state at the end of the phase relative to the
# historical state at the same date.
# "higher" says what a positive band means for that variable.
#
# vector = true marks the headline variables every phase chapter carries in its
# end vector. The ripple rule compares these.
#
# Adding a variable is a version change: bump VERSION and every version header.

version = "1.0"

# ----------------------------------------------------------------- population
[[var]]
id = "POP.night_control"
name = "Night control of hamlets"
higher = "more hamlets held by the GVN after dark"
indicators = "VCI tax collection; PF night ambush and patrol rate; hamlet officials sleeping in the hamlet; HES only with its A13 caveat"
systems = ["SECURE"]
vector = true

[[var]]
id = "POP.displacement"
name = "Displacement and forced urbanisation"
higher = "more refugees and more rural depopulation"
indicators = "refugee registrations; urban population growth; abandoned hamlets in free-fire areas"
