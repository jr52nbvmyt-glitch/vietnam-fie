# Vietnam Force-Injection Exercise — CONFIG
# Edit values here, never in the prose of RULES.md or the procedures.
# scripts/fie.py reads this file: the floors below are the floors the checker enforces.
# A value of "UNSET" blocks new memoranda until it is set (fie.py status reports it).

version = "1.0.7"

era_default = "2026"              # provisions are 2026 configurations unless the provision names another era
campaign_opens = "1964-01-01"     # COMUSMACV's opening date; no provision acts before its arrival date
default_arrival = "1964-01-01"    # arrival in theater when the provision message gives none
parts_per_memo = 3                # Part 1 = §1 · Part 2 = §2–§3 · Part 3 = §4–§6
checkpoint_every = 10             # complete memoranda between checkpoints
meta_every_checkpoints = 3        # a META after every third checkpoint
body_count = "ESTIMATED"          # ESTIMATED = cite only as a reported figure with its inflation acknowledged, and give your own estimate beside it (A13)
free_play = "ON"                  # ON | OFF (G4)
phase_redraw = "AT_CHECKPOINT"    # AT_CHECKPOINT = memos may propose a redraw; a checkpoint carries it out (G2)

# ---------------------------------------------------------------------------
# Political constraints, one switch each (A5).
#   MODELLED  = live and binding, as historical; work within it or argue to CINCPAC for relief and state the political cost
#   SUSPENDED = stipulated away for this exercise
# troop_ceiling takes HISTORICAL, NONE, or a whole number of US personnel in RVN.
# "Loosened" is not a value: say which constraints are suspended.
# ---------------------------------------------------------------------------
[constraints]
bombing_north   = "SUSPENDED"  # restricted and prohibited zones around Hanoi and Haiphong; Washington target approval. SUSPENDED by the user's provision of memorandum 013 (set 25 Nov 2026), with its terms: MACV chooses the targets in the North and holds standing permission to restrike; no restricted or prohibited zone around Hanoi or around Haiphong except that Haiphong's port infrastructure may be struck once only (everything else at and around Haiphong is open to strike and restrike); a 15-mile buffer along the Chinese border stays; Washington still decides whether the bombing happens and when it opens (2 March 1965, history's date; planning from the Gulf of Tonkin incident, August 1964), but the pauses and bombing suspensions within the campaign do not happen; Laos targets stay with the ambassador in Vientiane
haiphong_mining = "MODELLED"   # mining of Haiphong and the northern ports (historically prohibited until May 1972)
laos_ground     = "MODELLED"   # US/ARVN ground operations into Laos (historically barred; Lam Son 719 in 1971 was ARVN-only)
cambodia_ground = "MODELLED"   # ground operations into the Cambodian base areas (historically barred until May 1970)
cambodia_air    = "MODELLED"   # bombing of the Cambodian base areas (historically secret, from March 1969)
north_ground    = "MODELLED"   # ground operations into North Vietnam (historically never authorised)
dmz             = "MODELLED"   # DMZ conventions
roe             = "MODELLED"   # standing rules of engagement in the South
troop_ceiling   = "NONE"    # no limit on US personnel in RVN (set 21 Nov 2026)

# ---------------------------------------------------------------------------
# Standing conditions of the world, set by the user. Not provisions: no memorandum
# is written for them and they enter no provision index. They hold from campaign_opens.
# ---------------------------------------------------------------------------
[conditions]
space_constellations = "PRESENT"   # GPS and military SATCOM constellations exist and serve provisions built to use them (set 23 Nov 2026; errata E01, E02). The historical force gains no user equipment from this (A3a).
officer_cohorts_1957 = "PRESENT"  # The officer-education programme of memorandum 007 (P007a, P007b) has run since 1957: the US and ARVN officers commissioned 1957–63 completed it as new officers, and its course gates applied to their promotions before 1964. On 1 Jan 1964 the officer corps already holds these seven classes; the programme itself arrives with the campaign (set 24 Nov 2026 by the user's decision in the memorandum 007 thread). Nothing else from before 1964 changes (A1a).
rvn_industry_1964 = "PRESENT"   # The industrial base of memorandum 008 (P008a metallurgy and machining, P008b electronics manufacturing), one generation above the Republic of Vietnam's actual 1964 state, is standing and producing on 1 Jan 1964 with its plants, workforce, engineers and capital; South Vietnam only, the North's industry stays historical (set 24 Nov 2026 by the user's answer in the memorandum 008 thread). Nothing else from before 1964 changes (A1a).
enlisted_bct_1957 = "PRESENT"   # The basic training of memorandum 009 (P009a US entry-level training, P009b RVNAF regular basic training, P009c the abridged RF/PF course) began on the same date as the officer education of memorandum 007: every US and RVNAF regular enlisted man, and every Civil Guard and Self-Defense Corps (later RF and PF) recruit, who entered service from 1957 took it; on 1 Jan 1964 the forces already hold the men of those seven years who are still serving. The programmes themselves arrive with the campaign. Basic training only, no further training (set 24 Nov 2026 by the user's provision: "Begins same date as officer education"). Nothing else from before 1964 changes (A1a).
nco_education_1957 = "PRESENT"   # The NCO education of memorandum 010 (P010a the US services' 2026 enlisted professional military education, P010b the RVNAF regular forces' NCO education on the 2026 US Army model) began on the same date as the officer education of memorandum 007: from 1957 every US NCO and every RVNAF NCO of the regular forces and of the Regional and Popular Forces (the Civil Guard and Self-Defense Corps before 1964), those already serving in 1957 and every man promoted since, attended the 2026 course for his grade, each course a gate for the next promotion; on 1 Jan 1964 the NCO corps already holds the men of those seven years. The programmes themselves arrive with the campaign (set 24 Nov 2026 by the user's provision: "Begins same date as officer education"; RF and PF included by the user's ruling the same day, erratum E03). Nothing else from before 1964 changes (A1a).

# ---------------------------------------------------------------------------
# Floors — minima on effort, not targets (G7). A shortfall is reported in the
# audit line with its reason, never padded.
# ---------------------------------------------------------------------------
[floors]
dossier_fields = 16                  # D1–D16 per provision (Part 1)
channels = 9                         # of the 10 channels, content or a defended null (Part 2); the open channel may be empty
employment_concepts = 2              # per provision, plus any tried and abandoned
designations_per_part = 20           # distinct real designations per part (A11); counted approximately by the script
events_per_full_phase = 3            # dated, named events touched (new or altered) per revised phase
paragraphs_per_full_phase = 7        # touched event text plus the phase's analysis
new_operations_per_memo = 1          # once divergence is material
chains_per_memo = 3
chain_links = 3                      # A → B → C → D reaches link 3
findings_carried_per_full_phase = 1  # each revised phase cites at least one §2 finding by ID
clock_from_phase = "P3"              # every revised phase from this one on states the clock effect
enemy_initiative_per_memo = 1        # G3
changed_items = 3                    # §6
not_changed_items = 3                # §6

# ---------------------------------------------------------------------------
# Size limits — enforced by the script so always-loaded material cannot creep.
# ---------------------------------------------------------------------------
[limits]
card_chars_base = 5500              # a card's fixed part: title, findings, concepts, interactions
card_chars_per_provision = 7000      # added per provision (key figures, negative specification, denies, verdict, pushes); C3 forbids compressing a provision to fit
pack_cards = 8                       # most earlier cards loaded into a Part 2 pack
pack_chars = 140000                  # about 35,000 tokens per pack; a card that will not fit is loaded short (no key figures or negative specification) before routing stops
course_of_war_words = [1500, 3500]   # §4.0
null_words = [40, 160]               # a stated null for an unrevised phase
log_words = [80, 220]                # one Trajectory Log entry
log_entries_in_pack = 5              # recent Trajectory Log entries loaded for Part 3
chapters_full_read_chars = 40000      # about 10,000 tokens: above this (from the baseline on), Part 3 reads digests of every chapter and the full text only of those it changes
chapter_words_warn = 15000           # a chapter this long is flagged for consolidation at the next checkpoint

# ---------------------------------------------------------------------------
# Studies (v1.0.7, revisions/R02) — procedures/STUDY.md. A study is a deep account of
# one area of the war as the record stands; it describes and never changes the war.
# ---------------------------------------------------------------------------
[studies]
areas_per_run = [2, 3]           # areas the user names in one STUDY; one part (and one thread) per area
study_words = [5000, 14000]      # guide for a study's main text, every phase included
phase_words_min = 400            # guide per phase section; a quiet phase says why it is quiet
pack_chars = 180000              # a study part's pack: chapter digests, ledgers, positions, cards to read
rerun_after_entries = 6          # a checkpoint is advised to call a fresh STUDY after this many since-entries …
rerun_drift = 4                  # … or when a study value's midpoint has moved this far since the study judged it …
rerun_contradictions = 2         # … or when this many memoranda have contradicted the study in Part 2

